server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Service worker: never let the HTTP cache serve a stale copy. Clients need to
    # see file changes immediately so the app's own update flow can take over.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Web app manifest: correct MIME type + no caching.
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # HTML shell: always revalidate so a redeploy propagates instantly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # App scripts/styles: revalidate on every request. The service worker's own
    # cache still serves them instantly when the device is offline.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Fonts and icons rarely change: cache them for a week.
    location ~* \.(?:woff2?|ttf|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
